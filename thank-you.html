<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You — RPI SEMICON West 2026</title>
  <style>
    :root { --rpi-red:#d6001c; --ink:#151515; --line:#d9d9d9; --bg:#f5f5f5; }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px}
    .card{width:min(100%,560px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden;text-align:center}
    .bar{height:12px;background:var(--rpi-red)}
    .content{padding:36px 30px}
    h1{margin:0 0 12px;font-size:clamp(2rem,7vw,2.7rem)}
    p{margin:0;color:#444;font-size:1.08rem;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <div class="content">
      <h1>You're entered.</h1>
      <p>Thanks for stopping by RPI at SEMICON West.</p>
    </div>
  </main>
</body>
</html>
